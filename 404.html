<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Object Not Found — AWG Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="error-body">
    <main class="error-page">
        <div class="error-code">
            ERROR 404<br>
            QUERY STATUS: FAILED<br>
            ARCHIVE: ACCESSIBLE
        </div>

        <section class="error-content">
            <p class="section-label">ARCHIVE QUERY FAILED</p>
            <h1 class="error-title">OBJECT<br>NOT FOUND.</h1>

            <p class="error-intro">The requested information may:</p>

            <div class="error-reasons">
                <span>01</span><span>not exist</span>
                <span>02</span><span>have been moved</span>
                <span>03</span><span>not yet have been produced</span>
                <span>04</span><span>have been produced by Subject M and not recognized</span>
            </div>

            <a class="error-return" href="index.html">← RETURN TO ARCHIVE</a>
        </section>
    </main>
</body>
</html>
